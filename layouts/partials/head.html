<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}Provenance — design control, git-native{{ else }}{{ .Title }} · Provenance{{ end }}</title>
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gutter: 80px;
    --ink: #16181A;
    --muted: #5B5A54;
    --muted-2: #86837A;
    --paper: #F6F4EF;
    --paper-raised: #FFFFFF;
    --border: #DDD9CD;
    --accent: #1F5E46;
    --accent-hover: #17462F;
    --accent-tint: #EDF3EF;
    --rust: #A6512B;
    --rust-tint: #F6EBE4;
    --code-bg: #14171A;
    --code-border: #33362F;
    --code-text: #E7E4DA;
    --code-accent: #7FD8B0;
  }
  @media (max-width: 900px) { :root { --gutter: 28px; } }
  @media (max-width: 560px) { :root { --gutter: 18px; } }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { text-decoration: none; color: inherit; }
  svg { display: block; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .display { font-family: 'Space Grotesk', sans-serif; font-weight: 600; letter-spacing: -0.01em; margin: 0; }

  .sec { padding-left: var(--gutter); padding-right: var(--gutter); }

  .navlink { color: var(--muted); font-size: 14.5px; font-weight: 500; }
  .navlink:hover { color: var(--ink); }
  .navlink-active { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
  .cta-primary { background: var(--accent); color: var(--paper); display: inline-block; }
  .cta-primary:hover { background: var(--accent-hover); }
  .cta-ghost:hover { background: var(--ink); color: var(--paper); }
  .card:hover { border-color: var(--ink); }
  .repocard:hover { border-color: var(--ink); }

  .nav-wrap { position: sticky; top: 0; z-index: 10; background: #F6F4EFEE; backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px var(--gutter); flex-wrap: wrap; gap: 14px; row-gap: 10px; }
  .nav-links { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; row-gap: 10px; }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); padding: 15px 14px; font-size: 12.5px; }
  th { font-family: 'IBM Plex Mono', monospace; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-2); border-bottom: 1px solid var(--ink); font-size: 12px; }

  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; }
  @media (max-width: 760px) {
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr; gap: 28px; }
  }

  .arch-row { display: flex; gap: 64px; }
  .arch-label { width: 320px; flex-shrink: 0; }
  @media (max-width: 760px) {
    .arch-row { flex-direction: column; gap: 28px; }
    .arch-label { width: 100%; }
  }

  .hscroll { overflow-x: auto; }
  .hscroll::-webkit-scrollbar { height: 6px; }

  h1.hero { font-size: clamp(34px, 5.4vw, 60px); line-height: 1.08; }
  h1.page-h1 { font-size: clamp(30px, 4.4vw, 46px); line-height: 1.12; }
</style>
